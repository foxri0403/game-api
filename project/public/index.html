<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Sale</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">🎮 GameSale</div>

    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="게임 검색..." class="search">
      <button id="searchBtn" type="button" class="search-btn">검색</button>
    </div>

    <div class="nav-right">
      <div id="guestMenu">
        <a href="/login">로그인</a>
        <a href="/signup">회원가입</a>
      </div>

      <div id="userMenu" style="display:none;">
        <span id="username"></span>
        <button id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <section class="banner">
    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e" alt="banner">
    <div class="banner-text">
      <h1>🔥 지금 할인 중!</h1>
      <p>최대 80% 할인 게임 확인</p>
    </div>
  </section>

  <section class="game-section">
    <h2>검색 결과</h2>
    <div id="gameList" class="game-grid"></div>
  </section>

  <script src="/script.js"></script>
resultDiv.innerHTML += `
<div class="game-card">
    <img src="${game.image}" width="200">

    <h3>${game.name}</h3>

    <p style="color:red;font-weight:bold;">
        ${game.discount}% 할인
    </p>

    <p style="text-decoration:line-through;color:gray;">
        원가: ₩${game.originalPrice.toLocaleString()}
    </p>

    <p style="font-size:20px;font-weight:bold;">
        할인 가격: ₩${game.salePrice.toLocaleString()}
    </p>
</div>
`;
</body>
</html>
