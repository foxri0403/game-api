<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Sale</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">🎮 GameSale</div>

    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="게임 검색..." class="search">

      <select id="genreSelect" class="search genre-select">
        <option value="">전체 장르</option>
        <option value="19">액션</option>
        <option value="21">어드벤처</option>
        <option value="122">RPG</option>
        <option value="9">전략</option>
        <option value="599">시뮬레이션</option>
        <option value="701">스포츠</option>
        <option value="699">레이싱</option>
        <option value="113">무료 플레이</option>
        <option value="492">인디</option>
      </select>

      <button id="searchBtn" type="button" class="search-btn">검색</button>
    </div>

    <div class="nav-right">
      <div id="guestMenu">
        <a href="/login">로그인</a>
        <a href="/signup">회원가입</a>
      </div>

      <div id="userMenu" style="display:none;">
        <span id="username"></span>
        <button id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <section class="banner">
    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e" alt="banner">
    <div class="banner-text">
      <h1>🔥 지금 할인 중!</h1>
      <p>장르별 할인 게임을 확인하세요</p>
    </div>
  </section>

  <section class="game-section">
    <h2>검색 결과</h2>
    <div id="gameList" class="game-grid"></div>
  </section>

  <script src="/script.js"></script>
</body>
</html>
